<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한림제약 판매 대시보드</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #1a3a6b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    text-align: center;
  }
  .logo { margin-bottom: 8px; }
  .logo img { height: 48px; }
  .subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 32px;
  }
  .divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 0 0 28px;
  }
  .msg-box {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .msg-box.error   { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; display: block; }
  .msg-box.success { background: #f0fff4; color: #27ae60; border: 1px solid #c3e6cb; display: block; }
  .msg-box.info    { background: #f0f4ff; color: #2563eb; border: 1px solid #bfdbfe; display: block; }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type=email] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
    transition: border .2s;
  }
  input[type=email]:focus { border-color: #1a3a6b; }
  .btn {
    width: 100%;
    padding: 13px;
    background: #1a3a6b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: #14305a; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .hint {
    font-size: 12px;
    color: #888;
    margin-top: 12px;
  }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #aaa;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .sent-box { display: none; }
  .sent-box.visible { display: block; }
  .form-box { display: block; }
  .form-box.hidden { display: none; }
</style>
</head>

  <!-- 비밀번호 입력 박스 (미사용, 하위호환 유지) -->
  <div id="localPwBox" class="form-box" style="display:none !important; background:#fffbeb; border:1px solid #f59e0b; border-radius:8px; padding:14px; margin-bottom:12px;">
    <div style="font-size:12px; color:#92400e; margin-bottom:8px;">
      <strong>이메일/비밀번호 로그인</strong><br>
      계정: <span id="localEmailDisplay" style="font-weight:600;"></span>
    </div>
    <input type="password" id="localPwInput" placeholder="비밀번호 입력"
           style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; margin-bottom:8px;"
           onkeydown="if(event.key==='Enter') localSignIn()">
    <button onclick="localSignIn()"
            style="width:100%; padding:11px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer;">

  <!-- 이메일 입력 폼 -->
  <div class="form-box" id="formBox">
    <label for="emailInput">한림 이메일 주소</label>
    <input type="email" id="emailInput" placeholder="example@hanlim.com" autocomplete="email" autofocus>
    <label for="passwordInput" style="margin-top:10px;display:block;">비밀번호</label>
    <input type="password" id="passwordInput" placeholder="비밀번호 입력" autocomplete="current-password">
    <button class="btn" id="sendBtn" onclick="handlePrimaryAction()">로그인</button>
    <p class="hint">@hanlim.com 이메일과 등록된 비밀번호로 로그인합니다.</p>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ================================================================
// Firebase 설정
// ================================================================
const BUILD_VERSION  = '2026-10-30-password-only';
const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyC1l8qJ-bDh4pGELdmW8B5xiCCoVQNBrWE",
    authDomain:        "hanlim-target-dfd63.firebaseapp.com",
    projectId:         "hanlim-target-dfd63",
    storageBucket:     "hanlim-target-dfd63.firebasestorage.app",
    messagingSenderId: "621470397001",
    appId:             "1:621470397001:web:a583503fd36fcb93c6c598"
};
const DASHBOARD_URL = 'dashboard.html';
const LOGOUT_MARKER_KEY = 'justLoggedOutAt';
const LOGOUT_GRACE_MS = 60 * 1000;

// Firebase 초기화
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

console.log('[Hanlim Login] build:', BUILD_VERSION);
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => {
  console.warn('Auth persistence 설정 실패:', err && err.message ? err.message : err);
});

const logoutMarkerRaw = sessionStorage.getItem(LOGOUT_MARKER_KEY);
const justLoggedOut = !!logoutMarkerRaw && (Date.now() - Number(logoutMarkerRaw) < LOGOUT_GRACE_MS);
if (logoutMarkerRaw) {
  sessionStorage.removeItem(LOGOUT_MARKER_KEY);
}

let isBusy = false;

const msgBox = document.getElementById('msgBox');
const formBox = document.getElementById('formBox');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const sendBtn = document.getElementById('sendBtn');

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = 'msg-box ' + type;
}

function hideMsg() {
  msgBox.textContent = '';
  msgBox.className = 'msg-box';
}

function getButtonLabel() {
  return '로그인';
}

function setBusy(flag, label) {
  isBusy = flag;
  sendBtn.disabled = flag;
  sendBtn.textContent = flag ? label : getButtonLabel();
}

function isHanlimEmail(email) {
  return /^[^\s@]+@hanlim\.com$/i.test(email || '');
}

function normalizeEmail(value) {
  return (value || '').trim().toLowerCase();
}

function getFriendlyError(err, fallbackPrefix) {
  const code = err && err.code ? err.code : '';
  if (code === 'auth/quota-exceeded' || code === 'auth/too-many-requests') {
    return '시도 횟수가 많습니다. 잠시 후 다시 시도해주세요.';
  }
  if (code === 'auth/network-request-failed') {
    return '네트워크 연결을 확인해주세요.';
  }
  if (code === 'auth/invalid-email') {
    return '이메일 형식이 올바르지 않습니다.';
  }
  if (code === 'auth/invalid-credential' || code === 'auth/wrong-password') {
    return '비밀번호가 올바르지 않습니다.';
  }
  if (code === 'auth/user-not-found') {
    return '해당 이메일로 등록된 계정이 없습니다.';
  }
  if (code === 'auth/user-disabled') {
    return '해당 계정은 사용할 수 없습니다.';
  }
  const msg = err && err.message ? err.message : '알 수 없는 오류가 발생했습니다.';
  return fallbackPrefix ? (fallbackPrefix + ': ' + msg) : msg;
}

async function saveVisitLog(user) {
  try {
    const email = (user.email || '').toLowerCase();
    let empName = user.displayName || '';
    let empDept = '';
    let empPosition = '';

    try {
      const empDoc = await db.collection('config').doc('employees').get();
      if (empDoc.exists && empDoc.data().list) {
        const emp = empDoc.data().list.find(e => (e.email || '').toLowerCase() === email);
        if (emp) {
          empName = emp.name || empName;
          empDept = emp.dept || '';
          empPosition = emp.position || '';
        }
      }
    } catch (e2) {
      console.warn('직원 조회 실패:', e2 && e2.message ? e2.message : e2);
    }

    await db.collection('visitLogs').add({
      email: email,
      name: empName,
      dept: empDept,
      position: empPosition,
      loginTime: firebase.firestore.FieldValue.serverTimestamp(),
      loginTimeLocal: new Date().toISOString(),
      userAgent: navigator.userAgent,
      buildVersion: BUILD_VERSION
    });
  } catch (e) {
    console.warn('visitLogs 저장 실패:', e && e.message ? e.message : e);
  }
}

async function handlePrimaryAction() {
  if (isBusy) return;

  const email = normalizeEmail(emailInput.value);
  const pw = passwordInput.value || '';

  if (!isHanlimEmail(email)) {
    showMsg('@hanlim.com 이메일만 사용 가능합니다.', 'error');
    return;
  }
  if (!pw) {
    showMsg('비밀번호를 입력해주세요.', 'error');
    passwordInput.focus();
    return;
  }

  setBusy(true, '로그인 중...');
  hideMsg();

  try {
    const result = await auth.signInWithEmailAndPassword(email, pw);
    await saveVisitLog(result.user || {});
    window.location.replace(DASHBOARD_URL);
  } catch (err) {
    setBusy(false);
    showMsg(getFriendlyError(err, '로그인 실패'), 'error');
  }
}

function resetForm() {
  emailInput.value = '';
  passwordInput.value = '';
  hideMsg();
  setBusy(false);
}

emailInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    passwordInput.focus();
  }
});

passwordInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    handlePrimaryAction();
  }
});

auth.onAuthStateChanged(user => {
  if (justLoggedOut) {
    if (user) {
      auth.signOut().catch(() => {});
    }
    return;
  }

  if (user && isHanlimEmail(user.email || '')) {
    window.location.replace(DASHBOARD_URL);
  }
});

formBox.classList.remove('hidden');
hideMsg();
setBusy(false);
</script>
