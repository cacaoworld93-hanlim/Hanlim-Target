<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한림제약 판매 대시보드</title>
<!-- build: 2026-10-30-final-1 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #1a3a6b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    text-align: center;
  }
  .logo { margin-bottom: 8px; }
  .logo img { height: 48px; }
  .subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 32px;
  }
  .divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 0 0 28px;
  }
  .msg-box {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .msg-box.error   { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; display: block; }
  .msg-box.success { background: #f0fff4; color: #27ae60; border: 1px solid #c3e6cb; display: block; }
  .msg-box.info    { background: #f0f4ff; color: #2563eb; border: 1px solid #bfdbfe; display: block; }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type=email] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 18px;
    outline: none;
    transition: border .2s;
  }
  input[type=email]:focus { border-color: #1a3a6b; }
  .btn {
    width: 100%;
    padding: 13px;
    background: #1a3a6b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: #14305a; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .hint {
    font-size: 12px;
    color: #888;
    margin-top: 12px;
  }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #aaa;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .sent-box { display: none; }
  .sent-box.visible { display: block; }
  .form-box { display: block; }
  .form-box.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="https://cacaoworld93-hanlim.github.io/Hanlim-Target/logo.png"
         onerror="this.style.display='none'"
         alt="한림제약">
    <div style="font-size:22px;font-weight:800;color:#1a3a6b;margin-bottom:4px;">한 림 제 약</div>
  </div>
  <div class="subtitle">판매 대시보드</div>
  <hr class="divider">

  <div id="msgBox" class="msg-box"></div>

  <!-- 이메일 입력 폼 -->
  <div class="form-box" id="formBox">
    <label for="emailInput">한림 이메일 주소</label>
    <input type="email" id="emailInput" placeholder="example@hanlim.com" autocomplete="email">
    <button class="btn" id="sendBtn" onclick="sendLoginLink()">로그인 링크 전송</button>
    <p class="hint">📧 @hanlim.com 이메일로 로그인 링크가 전송됩니다</p>
  </div>

  <!-- 전송 완료 안내 -->
  <div class="sent-box" id="sentBox">
    <div style="font-size:48px;margin-bottom:12px;">📬</div>
    <div style="font-size:16px;font-weight:700;color:#1a3a6b;margin-bottom:8px;">로그인 링크를 전송했습니다</div>
    <div style="font-size:13px;color:#555;line-height:1.6;">
      <span id="sentEmail"></span>로<br>
      전송된 메일의 <strong>링크를 클릭</strong>하면<br>
      자동으로 로그인됩니다.
    </div>
    <div style="margin-top:16px;font-size:12px;color:#888;">
      메일이 없으면 스팸함을 확인해주세요
    </div>
    <button class="btn" style="margin-top:20px;background:#eee;color:#333;" onclick="resetForm()">다시 시도</button>
  </div>

  <div class="footer">
    📞 02-3489-6226<br>
    © 2026 한림제약. All rights reserved.
  </div>
</div>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ================================================================
// Firebase 설정
// ================================================================
const BUILD_VERSION  = '2026-10-30-final-1';
const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyC1l8qJ-bDh4pGELdmW8B5xiCCoVQNBrWE",
    authDomain:        "hanlim-target-dfd63.firebaseapp.com",
    projectId:         "hanlim-target-dfd63",
    storageBucket:     "hanlim-target-dfd63.firebasestorage.app",
    messagingSenderId: "621470397001",
    appId:             "1:621470397001:web:a583503fd36fcb93c6c598"
};
const DASHBOARD_URL = 'dashboard.html';
const LOGIN_URL = window.location.origin + window.location.pathname;
const LOGOUT_MARKER_KEY = 'justLoggedOutAt';
const EMAIL_STORAGE_KEY = 'emailForSignIn';
const LOGOUT_GRACE_MS = 60 * 1000;

// Firebase 초기화
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

console.log('[Hanlim Login] build:', BUILD_VERSION);
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => {
  console.warn('Auth persistence 설정 실패:', err && err.message ? err.message : err);
});

const isEmailLink = firebase.auth().isSignInWithEmailLink(window.location.href);
const logoutMarkerRaw = sessionStorage.getItem(LOGOUT_MARKER_KEY);
const justLoggedOut = !!logoutMarkerRaw && (Date.now() - Number(logoutMarkerRaw) < LOGOUT_GRACE_MS);
if (logoutMarkerRaw) {
  sessionStorage.removeItem(LOGOUT_MARKER_KEY);
}

let currentMode = isEmailLink ? 'confirm' : 'send';
let isBusy = false;

const msgBox = document.getElementById('msgBox');
const formBox = document.getElementById('formBox');
const sentBox = document.getElementById('sentBox');
const emailInput = document.getElementById('emailInput');
const sendBtn = document.getElementById('sendBtn');
const sentEmail = document.getElementById('sentEmail');

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = 'msg-box ' + type;
}

function hideMsg() {
  msgBox.textContent = '';
  msgBox.className = 'msg-box';
}

function getButtonLabel() {
  return currentMode === 'confirm' ? '로그인 확인' : '로그인 링크 전송';
}

function setBusy(flag, label) {
  isBusy = flag;
  sendBtn.disabled = flag;
  sendBtn.textContent = flag ? label : getButtonLabel();
}

function isHanlimEmail(email) {
  return /^[^\s@]+@hanlim\.com$/i.test(email || '');
}

function normalizeEmail(value) {
  return (value || '').trim().toLowerCase();
}

function setSendMode(options) {
  options = options || {};
  currentMode = 'send';
  formBox.classList.remove('hidden');
  sentBox.classList.remove('visible');
  sendBtn.onclick = function(event) {
    if (event) event.preventDefault();
    handlePrimaryAction();
    return false;
  };
  setBusy(false);
  if (typeof options.prefill === 'string') {
    emailInput.value = options.prefill;
  }
  if (options.keepMessage) {
    // 기존 메시지 유지
  } else if (options.message) {
    showMsg(options.message, options.messageType || 'info');
  } else {
    hideMsg();
  }
}

function setConfirmMode(options) {
  options = options || {};
  currentMode = 'confirm';
  formBox.classList.remove('hidden');
  sentBox.classList.remove('visible');
  sendBtn.onclick = function(event) {
    if (event) event.preventDefault();
    handlePrimaryAction();
    return false;
  };
  setBusy(false);
  if (typeof options.prefill === 'string') {
    emailInput.value = options.prefill;
  }
  showMsg(
    options.message || '보안을 위해 로그인에 사용한 이메일 주소를 다시 입력해주세요. 같은 브라우저에서 링크를 열면 재입력 없이 바로 로그인됩니다.',
    options.messageType || 'info'
  );
}

function showSentState(email) {
  formBox.classList.add('hidden');
  sentBox.classList.add('visible');
  sentEmail.textContent = email;
  hideMsg();
  setBusy(false);
}

function getFriendlyError(err, fallbackPrefix) {
  const code = err && err.code ? err.code : '';
  if (code === 'auth/quota-exceeded') {
    return '이메일 링크 발송 한도를 초과했습니다. Firebase 발송 quota가 초기화된 뒤 다시 시도해주세요.';
  }
  if (code === 'auth/invalid-email') {
    return '이메일 형식이 올바르지 않습니다.';
  }
  if (code === 'auth/invalid-action-code' || code === 'auth/expired-action-code') {
    return '로그인 링크가 만료되었거나 이미 사용되었습니다. 새 로그인 링크를 다시 받아주세요.';
  }
  if (code === 'auth/user-disabled') {
    return '해당 계정은 사용할 수 없습니다.';
  }
  const msg = err && err.message ? err.message : '알 수 없는 오류가 발생했습니다.';
  return fallbackPrefix ? (fallbackPrefix + ': ' + msg) : msg;
}

async function saveVisitLog(user) {
  try {
    await db.collection('visitLogs').add({
      email: user.email || '',
      name: user.displayName || '',
      loginAt: firebase.firestore.FieldValue.serverTimestamp(),
      userAgent: navigator.userAgent,
      buildVersion: BUILD_VERSION
    });
  } catch (e) {
    console.warn('visitLogs 저장 실패:', e && e.message ? e.message : e);
  }
}

async function completeEmailLinkSignIn(email) {
  const normalized = normalizeEmail(email);
  if (!isHanlimEmail(normalized)) {
    setConfirmMode({
      prefill: normalized,
      message: '@hanlim.com 이메일 주소를 정확히 입력해주세요.',
      messageType: 'error'
    });
    return;
  }

  setBusy(true, '로그인 처리 중...');
  showMsg('로그인 처리 중...', 'info');

  try {
    const result = await auth.signInWithEmailLink(normalized, window.location.href);
    localStorage.removeItem(EMAIL_STORAGE_KEY);
    sessionStorage.removeItem(LOGOUT_MARKER_KEY);
    await saveVisitLog(result.user || {});
    window.location.replace(DASHBOARD_URL);
  } catch (err) {
    console.error('signInWithEmailLink 실패:', err);
    setConfirmMode({
      prefill: normalized,
      message: getFriendlyError(err, '로그인 실패'),
      messageType: 'error'
    });
  }
}

function handlePrimaryAction() {
  if (isBusy) return;
  const email = normalizeEmail(emailInput.value);

  if (!email) {
    showMsg('이메일을 입력해주세요.', 'error');
    return;
  }
  if (!isHanlimEmail(email)) {
    showMsg('@hanlim.com 이메일만 사용 가능합니다.', 'error');
    return;
  }

  if (currentMode === 'confirm') {
    completeEmailLinkSignIn(email);
  } else {
    sendLoginLink(email);
  }
}

async function sendLoginLink(emailArg) {
  const email = normalizeEmail(emailArg || emailInput.value);
  if (!isHanlimEmail(email)) {
    showMsg('@hanlim.com 이메일만 사용 가능합니다.', 'error');
    return;
  }

  setBusy(true, '전송 중...');

  const actionCodeSettings = {
    url: LOGIN_URL,
    handleCodeInApp: true
  };

  try {
    await auth.sendSignInLinkToEmail(email, actionCodeSettings);
    localStorage.setItem(EMAIL_STORAGE_KEY, email);
    showSentState(email);
  } catch (err) {
    console.error('sendSignInLinkToEmail 실패:', err);
    setBusy(false);
    showMsg(getFriendlyError(err, '전송 실패'), 'error');
  }
}

function resetForm() {
  localStorage.removeItem(EMAIL_STORAGE_KEY);
  emailInput.value = '';
  setSendMode();
}

emailInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    handlePrimaryAction();
  }
});

sendBtn.onclick = function(event) {
  if (event) event.preventDefault();
  handlePrimaryAction();
  return false;
};

// 이미 로그인된 경우 대시보드로 이동
// 단, 방금 로그아웃했거나 이메일 링크 처리 중이면 자동 이동하지 않음
auth.onAuthStateChanged(user => {
  if (justLoggedOut) {
    if (user) {
      auth.signOut().catch(() => {});
    }
    return;
  }

  if (isEmailLink) {
    return;
  }

  if (user && isHanlimEmail(user.email || '')) {
    window.location.replace(DASHBOARD_URL);
  }
});

if (isEmailLink) {
  const storedEmail = normalizeEmail(localStorage.getItem(EMAIL_STORAGE_KEY) || '');
  if (storedEmail) {
    emailInput.value = storedEmail;
    completeEmailLinkSignIn(storedEmail);
  } else {
    setConfirmMode();
  }
} else {
  setSendMode();
}
</script>
</body>
</html>
